        minimum_power_fraction: 0.5
        maximum_power_fraction: 1.0
        ramp_up_rate: 0.50 /h
        ramp_down_rate: 0.25 /h
        deep_reduction_threshold_fraction: 0.8
        deep_reduction_request_duration: 2 h
        max_deep_reduction_cycles: 2 /day
