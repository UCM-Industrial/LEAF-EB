# LEAF-EB Example 02 - Temporal Monte Carlo uncertainty
# Builds on Example 01 and adds stochastic sampling of historical residuals.

scenario:
  folder: Outputs
  subfolder: Example_02_monte_carlo
  start_date: '2025-01-01'
  end_date: '2026-12-31'

historical_data:
  file: Inputs/data/example_history_daily.csv
  date_column: Date
  processing_resolution: daily
  unit: MWh

projection:
  resolution: daily
  variability:
    enabled: true                  # Required for temporal Monte Carlo.
    resolution: daily
    mode: M
    plot_residuals: false
  save_plots: false

simulation:
  resolution: daily
  capacity_tolerance: "0 %"
  console_output: standard
  monte_carlo:
    simulations: 5                 # Small value so the example runs quickly.
    workers: 1
    seed: 12345                    # Fixed seed makes the example reproducible.
    confidence_level: 0.95
    preserve_annual_targets: false # Annual energy may vary between samples.
    technology_uncertainty: false  # Separate from temporal uncertainty.
    resume: false
    sources:
      - Demand
      - Solar
      - Wind
      - Hydro
      - Gas

demand:
  target_production: "6000 MWh/day"
  model: linear
  balance: 1.0
  values:
    '2025-01-01': 0.98
    '2026-01-01': 1.00

sources:
  Solar:
    share: 0.30
    capacity_factor: 0.25
    model: linear
    values:
      '2025-01-01': 0.98
      '2026-01-01': 1.00

  Wind:
    share: 0.30
    capacity_factor: 0.38
    model: linear
    values:
      '2025-01-01': 0.98
      '2026-01-01': 1.00

  Hydro:
    share: 0.25
    capacity_factor: 0.50
    model: linear
    values:
      '2025-01-01': 0.98
      '2026-01-01': 1.00

  Gas:
    share: 0.15
    capacity_factor: 0.50
    model: linear
    values:
      '2025-01-01': 0.98
      '2026-01-01': 1.00

commodities_input:
  run_commodities: true

output:
  level: comparison
  event_threshold: 1.0e-09
  emissions: false
